<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eaf8f3"><title>今天煮什麼？｜KakaTools</title><link rel="stylesheet" href="style.css"></head><body><nav><a href="../">← KakaTools</a><span>料理靈感 🍳</span></nav><main><header><p>KITCHEN IDEA LAB</p><h1>冰箱有什麼，<br><em>今晚就煮什麼。</em></h1></header><section class="mode-tabs"><button data-mode="normal" class="active">🍳 今晚煮什麼</button><button data-mode="leftover">♻️ 剩菜再利用</button></section><section class="lab"><div class="controls"><h2>冰箱裡有什麼？</h2><div id="ingredients" class="ingredient-grid"></div><p class="mini">可複選；剩菜模式會優先使用最多已選食材。</p><label>想吃的菜系<select id="cuisine"><option value="any">環遊世界</option><option>沖繩／日式</option><option>台灣</option><option>香港／廣東</option><option>韓式</option><option>泰式</option><option>義式／西式</option></select></label><label>今天有多少時間<select id="time"><option value="any">不限</option><option value="quick">15 分鐘快手</option><option value="normal">30 分鐘剛好</option><option value="slow">慢慢煮</option></select></label><button id="generate">✨ 給我一道菜</button><button id="surprise">完全隨機</button></div><article id="idea" class="idea"><div class="plate">🍽️</div><p class="kicker">今晚的靈感</p><h2>選好條件，讓廚房開動</h2><p class="desc">我們會配對冰箱食材、菜系與所需時間。</p></article></section><section class="shelves"><article><div class="shelf-title"><h2>❤️ 收藏料理</h2><button data-clear="favorites">清空</button></div><div id="favorites" class="saved-list empty">還沒有收藏，遇到喜歡的料理就按愛心。</div></article><article><div class="shelf-title"><h2>🛒 採買清單</h2><button data-clear="shopping">清空</button></div><form id="shopping-form"><input id="shopping-input" placeholder="新增要買的食材" maxlength="24"><button>加入</button></form><div id="shopping" class="saved-list empty">清單是空的。</div></article></section><section class="tip"><span>💡</span><div><strong>零浪費小提示</strong><p>先勾選最需要用掉的食材，再開啟「剩菜再利用」；產生器會優先找能一次消耗較多食材的料理。</p></div></section></main><script src="app.js"></script></body></html>
