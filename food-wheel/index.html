<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff7e8"><title>今天外食吃什麼？｜KakaTools</title><link rel="stylesheet" href="style.css"></head><body><nav><a href="../">← KakaTools</a><span>選擇救星 🎡</span></nav><main><header><p class="eyebrow">DINNER DECIDER</p><h1>今天外食<br><em>吃什麼？</em></h1><p>選地點和條件，把選擇困難交給輪盤。</p></header><section class="location-tabs" aria-label="地區"><button data-place="okinawa" class="active">🌺 沖繩</button><button data-place="taiwan">🧋 台灣</button><button data-place="hongkong">🥢 香港</button></section><section class="filters" aria-label="用餐條件"><label>預算<select id="budget"><option value="any">預算不限</option><option value="low">省一點</option><option value="mid">一般</option><option value="high">好好吃一頓</option></select></label><label>距離<select id="distance"><option value="any">距離不限</option><option value="near">附近就好</option><option value="medium">可以走遠一點</option></select></label><label class="kids"><input id="kids" type="checkbox"><span>👨‍👩‍👧 帶小孩</span></label><label>今天不想吃<select id="exclude"><option value="none">沒有排除</option><option value="noodle">麵類</option><option value="rice">飯類</option><option value="meat">大口吃肉</option><option value="raw">生食</option><option value="spicy">辣味</option></select></label></section><section class="workspace"><div class="wheel-wrap"><canvas id="wheel" width="560" height="560" aria-label="餐飲輪盤"></canvas><div class="pointer">▼</div><button id="spin" class="spin">轉一下</button></div><div class="panel"><div id="result" class="result" aria-live="polite"><small>命運還沒決定</small><strong>準備好了嗎？</strong></div><p id="match-note" class="match-note"></p><div class="panel-title"><h2>輪盤選項</h2><button id="reset" class="text-btn">還原預設</button></div><div id="items" class="chips"></div><form id="add-form"><input id="new-item" maxlength="16" placeholder="例如：沖繩麵" required><button>＋ 加入</button></form><p class="hint">點選項可暫時停用，按 × 可移除；自訂項目預設為一般預算、附近、親子友善。</p></div></section></main><div id="confetti" aria-hidden="true"></div><script src="app.js"></script></body></html>
