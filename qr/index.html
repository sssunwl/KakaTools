<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fffaf2"><title>QR 產生器 🌳｜KakaTools</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script><script src="vendor/jsQR.js"></script></head>
<body><nav><a href="../">← KakaTools</a><span>QR 產生器 🌳</span></nav><main><header><span class="eyebrow">把連結，種成自己的樣子</span><h1>一掃就出發。</h1><p>做一張喜歡的 QR，或讓它長成一棵小樹。內容與圖片都只留在這裡。</p></header>
<label class="input-label" for="content">連結或任何文字</label><textarea id="content" rows="2" placeholder="貼上連結，也可以輸入中文或 emoji…"></textarea><p id="input-note" class="hint" aria-live="polite"></p>
<div class="tabs" role="tablist" aria-label="QR 模式"><button id="tab2d" role="tab" aria-selected="true" aria-controls="panel2d">2D 風格</button><button id="tab3d" role="tab" aria-selected="false" aria-controls="panel3d">3D 小樹</button></div>
<div class="workspace"><section class="preview-card"><div id="panel2d" role="tabpanel" aria-labelledby="tab2d"><div class="preview" id="preview2d"><p>貼上內容，QR 就會出現。</p></div></div><div id="panel3d" role="tabpanel" aria-labelledby="tab3d" hidden><div id="scene"></div><div class="scene-actions"><button id="fold">點樹，看 QR</button></div></div><p id="status" role="status">先貼上連結或文字吧。</p><div id="downloads2d" class="downloads"><button id="png" disabled>下載 PNG</button><button id="svg" disabled>下載 SVG</button></div><div id="downloads3d" class="downloads" hidden><div class="export-control"><button id="export" aria-expanded="false" disabled>匯出 ↗</button><div id="export-menu" hidden><button id="flat" disabled>平面 QR PNG</button><button id="poster" disabled>樹景海報 PNG</button><button id="video" disabled>動態 QR 影片</button></div></div></div><p id="poster-status" class="hint" aria-live="polite"></p></section>
<aside id="settings2d"><details open><summary>顏色與漸層</summary><div class="presets"><button data-preset="coral">珊瑚</button><button data-preset="mint">薄荷</button><button data-preset="navy">墨藍</button><button data-preset="classic">黑白</button></div><div class="fields"><label>前景色<input id="fg" type="color" value="#9d392b"></label><label>背景色<input id="bg" type="color" value="#fffaf2"></label><label>第二色<input id="fg2" type="color" value="#374a70"></label><label>漸層<select id="gradient"><option value="none">無</option><option value="linear">線性</option><option value="radial">放射</option></select></label><label>線性角度<select id="angle"><option>0</option><option>45</option><option>90</option><option>135</option></select></label></div></details>
<details open><summary>形狀與輸出</summary><div class="fields"><label>資料點<select id="shape"><option value="square">方塊</option><option value="rounded">圓角方塊</option><option value="dot">圓點</option><option value="connected">相連圓角</option></select></label><label>定位方塊<select id="finder"><option value="square">方</option><option value="rounded">圓角</option></select></label><label>容錯等級<select id="ec"><option>L</option><option selected>M</option><option>Q</option><option>H</option></select></label><label>輸出尺寸<select id="size"><option>512</option><option selected>1024</option><option>2048</option></select></label><label>留白格數<input id="quiet" type="number" min="4" max="8" value="4"></label></div></details>
<details open><summary>中間 logo</summary><label class="upload">選一張圖片<input id="logo" type="file" accept="image/*"></label><label>大小 <output id="logo-value">18%</output><input id="logoSize" type="range" min="10" max="22" value="18"></label><button id="remove-logo">移除 logo</button><p id="logo-note" class="hint">圖片只在本機讀取，不會上傳。為了保護定位格，必要時會自動縮小。</p></details></aside>
<aside id="settings3d" hidden><div class="season-row"><div class="seasons"><button data-season="spring" aria-pressed="true">🌸 春</button><button data-season="summer" aria-pressed="false">☀ 夏</button><button data-season="autumn" aria-pressed="false">🍂 秋</button></div><button id="sound" aria-pressed="false" aria-label="開關環境音">🔇</button></div><div class="swatches"><button data-leaf="#df91ad" aria-label="粉" style="--swatch:#df91ad"></button><button data-leaf="#9463ac" aria-label="紫" style="--swatch:#9463ac"></button><button data-leaf="#bf4444" aria-label="紅" style="--swatch:#bf4444"></button><button data-leaf="#e5b632" aria-label="黃" style="--swatch:#e5b632"></button><button data-leaf="#517fb4" aria-label="藍" style="--swatch:#517fb4"></button><button data-leaf="#d5d6d2" aria-label="淺灰" style="--swatch:#d5d6d2"></button></div><button id="season-leaf">使用季節原色</button></aside></div></main><footer>每次下載前，都幫你掃一次。</footer><script type="module" src="app.js"></script></body></html>
