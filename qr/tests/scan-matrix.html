<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR 掃描矩陣測試</title><link rel="stylesheet" href="../style.css"><script src="../vendor/jsQR.js"></script><style>table{border-collapse:collapse;width:100%;font-size:12px;table-layout:fixed}td,th{border:1px solid #ccc;padding:8px;text-align:left;overflow-wrap:anywhere}.fail{background:#ffddd3}.pass{background:#e1f2e7}main{max-width:1400px}#samples{display:flex;flex-wrap:wrap}#samples canvas{width:160px;height:160px}</style></head><body><main><a href="../">← QR 產生器</a><h1 id="count">0/0 通過</h1><p id="progress" role="status">準備測試…</p><p>每條字串：4 資料點 × 2 定位框 × 4 容錯 × 有／無 logo × 無／線性／放射漸層，另驗證 PNG、SVG、三季平面 QR 與三季海報。logo 依正式規則強制 H。所有圖走正式渲染與驗證函式；海報上半部使用純色佔位。</p><div id="samples"></div><table><thead><tr><th>組合</th><th>結果</th><th>解出內容／原因</th></tr></thead><tbody id="rows"></tbody></table></main><script type="module">
import {createQR} from '../qr-core.js';
import {renderCanvas,renderSVG,floorColors,renderFloor,composePoster,logoBox} from '../render2d.js';
import {verify,svgCanvas,contrastReason} from '../verify.js';
const texts=['https://sssunwl.github.io/KakaTools/','https://example.com/'+ 'a'.repeat(100),'中文測試：今天吃什麼？🍜'];
// Exactly 120 characters, independent of the short URL above.
texts[1]='https://example.com/'+ 'a'.repeat(120-'https://example.com/'.length);
const logo='data:image/svg+xml;base64,'+btoa('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="white"/><path d="M40 8L68 58H12Z" fill="#22614f"/><path d="M36 50H44V76H36Z" fill="#663f2d"/></svg>');
let passed=0,total=0;const rows=document.getElementById('rows'),count=document.getElementById('count');
function record(name,result){total++;if(result.ok)passed++;const row=document.createElement('tr');row.className=result.ok?'pass':'fail';for(const value of [name,result.ok?'ok':'FAIL',result.text||result.reason]){const td=document.createElement('td');td.textContent=value;row.append(td);}rows.append(row);count.textContent=`${passed}/${total} 通過`;}
for(const [index,text] of texts.entries()){
 for(const shape of ['square','rounded','dot','connected'])for(const finder of ['square','rounded'])for(const ec of ['L','M','Q','H'])for(const hasLogo of [false,true])for(const gradient of ['none','linear','radial']){
  const o={shape,finder,ec:hasLogo?'H':ec,logo:hasLogo?logo:'',logoSize:.18,gradient,angle:45,fg:'#244c42',fg2:'#57365c',bg:'#fffaf2',quiet:4,size:512},q=createQR(text,o.ec),label=`文字${index+1} ${shape}/${finder}/${ec}${hasLogo?'→H logo':''}/${gradient}`;
  try{const c=await renderCanvas(q,o);record(label+' PNG',verify(c,text,o));const svg=await svgCanvas(renderSVG(q,o),o.size);record(label+' SVG',verify(svg,text,o));if(total%200===0){document.getElementById('progress').textContent=label;await new Promise(r=>setTimeout(r,0));}}catch(e){record(label,{ok:false,reason:String(e)});}
 }
 for(const season of ['spring','summer','autumn']){const q=createQR(text),flat=renderFloor(q,floorColors(q,text,season));record(`文字${index+1} ${season} 平面`,verify(flat,text));record(`文字${index+1} ${season} 海報`,verify(composePoster(null,flat,text),text));if(index===0){flat.title=season;document.getElementById('samples').append(flat);}}
}
// Output sizes, quiet zones and linear directions are exercised in addition to the Cartesian style matrix.
for(const size of [512,1024,2048])for(const quiet of [4,5,6,7,8])for(const angle of [0,45,90,135]){const text=texts[2],o={shape:'rounded',finder:'rounded',ec:'M',gradient:'linear',fg:'#244c42',fg2:'#57365c',bg:'#fffaf2',size,quiet,angle};const q=createQR(text);record(`尺寸${size}/留白${quiet}/角度${angle}`,verify(await renderCanvas(q,o),text,o));}
for(const [fg,bg,expected] of [['#cccccc','#ffffff','對比不足'],['#ffffff','#000000','前景要比背景深']]){const reason=contrastReason({fg,bg,gradient:'none'});record('拒絕不安全配色 '+fg,{ok:reason.startsWith(expected),text:reason});}
const q=createQR(texts[2],'H'),box=logoBox(q,{logo,logoSize:.9});let safe=true;if(box)for(let r=Math.floor(box.start);r<Math.ceil(box.end);r++)for(let c=Math.floor(box.start);c<Math.ceil(box.end);c++)if(q.isFinder(r,c)||q.isTiming(r,c))safe=false;record('過大 logo 自動縮小、不碰定位方塊與 timing',{ok:safe,text:box?`${Math.round(box.side/q.size*100)}%`:'不繪製 logo'});
document.getElementById('progress').textContent='測試完成';window.scanResults={passed,total};
</script></body></html>
