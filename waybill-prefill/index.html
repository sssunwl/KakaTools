<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>運單預填工具 - Invoice/Packing List → DHL/FedEx/UPS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #0f3460;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
        }

        main {
            padding: 40px 30px;
            background: #0f3460;
            color: #e0e0e0;
        }

        .step {
            margin-bottom: 40px;
        }

        .step-number {
            display: inline-block;
            width: 36px;
            height: 36px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 36px;
            font-weight: bold;
            margin-right: 12px;
            font-size: 16px;
        }

        .step-title {
            font-size: 18px;
            font-weight: 600;
            color: #e0e0e0;
            display: inline-block;
            vertical-align: middle;
        }

        .step-content {
            margin-left: 48px;
            margin-top: 15px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            background: #1a2749;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #2a3a59;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #3a4a69;
        }

        .upload-area p {
            font-size: 16px;
            color: #667eea;
            margin-bottom: 8px;
        }

        .upload-area small {
            color: #999;
            display: block;
        }

        #fileInput {
            display: none;
        }

        .file-list {
            margin-top: 20px;
        }

        .file-item {
            display: flex;
            gap: 15px;
            align-items: center;
            background: #1a2749;
            border: 1px solid #334455;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .file-info {
            flex: 1;
            min-width: 0;
        }

        .file-name {
            font-size: 14px;
            color: #e0e0e0;
            word-break: break-all;
            margin-bottom: 4px;
        }

        .file-type-selector {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .file-type-selector label {
            font-size: 12px;
            color: #aaa;
        }

        .file-type-selector select {
            background: #0f1e2e;
            border: 1px solid #334455;
            border-radius: 4px;
            color: #e0e0e0;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        .file-type-selector select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-remove {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-remove:hover {
            background: #c0392b;
        }

        .btn-parse {
            margin-top: 30px;
            padding: 14px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-parse:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-parse:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results {
            margin-top: 40px;
            display: none;
        }

        .results.show {
            display: block;
        }

        .tabs {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid #334455;
            margin-bottom: 30px;
        }

        .tab-btn {
            padding: 12px 20px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            color: #999;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.show {
            display: block;
        }

        .fields-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }

        .field-card {
            border: 1px solid #334455;
            border-radius: 8px;
            padding: 16px;
            background: #1a2749;
            transition: all 0.3s ease;
        }

        .field-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .field-card.error {
            background: #2a1a1a;
            border-color: #e74c3c;
        }

        .field-label {
            font-size: 12px;
            font-weight: 700;
            color: #667eea;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .field-value {
            font-size: 15px;
            color: #e0e0e0;
            word-break: break-word;
            line-height: 1.5;
            margin-bottom: 10px;
            font-family: 'Courier New', monospace;
            background: #0f1e2e;
            padding: 8px;
            border-radius: 4px;
            min-height: 24px;
        }

        .field-value.missing {
            color: #e74c3c;
            font-style: italic;
        }

        .field-value.missing::before {
            content: "❌ ";
        }

        .btn-copy {
            width: 100%;
            padding: 8px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-copy:hover {
            background: #764ba2;
        }

        .btn-copy.copied {
            background: #27ae60;
        }

        .error-message {
            background: #2a1a1a;
            border-left: 4px solid #e74c3c;
            color: #ff6b6b;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
            font-size: 14px;
        }

        .success-message {
            background: #1a2a1a;
            border-left: 4px solid #27ae60;
            color: #51cf66;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
            font-size: 14px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f0f0f0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        footer {
            border-top: 1px solid #334455;
            padding: 20px 30px;
            background: #0a1628;
            font-size: 12px;
            color: #666;
            text-align: center;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 22px;
            }

            main {
                padding: 25px 15px;
            }

            .file-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .tabs {
                flex-wrap: wrap;
            }

            .fields-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <style>
        :root { --ink:#283044; --muted:#747887; --paper:#fff9ef; --coral:#ff6b57; --orange:#ffb33c; --line:rgba(40,48,68,.11); }
        body { padding:0 20px 44px; color:var(--ink); font-family:ui-rounded,"SF Pro Rounded","Noto Sans TC",system-ui,sans-serif; background:radial-gradient(circle at 8% 10%,#ffd9bc 0,transparent 28%),radial-gradient(circle at 92% 80%,#d9d8ff 0,transparent 28%),linear-gradient(145deg,#fffaf2,#f7f5ff); }
        .kaka-nav { max-width:1200px; margin:auto; padding:22px 4px; display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:800; }
        .kaka-nav a { color:var(--ink); text-decoration:none; transition:transform .2s; }
        .kaka-nav a:hover { transform:translateX(-4px); }
        .kaka-nav span { color:var(--muted); }
        .container { max-width:1200px; border-radius:32px; background:rgba(255,255,255,.78); border:1px solid rgba(255,255,255,.9); box-shadow:0 22px 70px rgba(55,45,76,.13); }
        header { position:relative; overflow:hidden; padding:54px 30px; background:linear-gradient(135deg,#ff765f,#ffab48); }
        header::before, header::after { content:""; position:absolute; border-radius:50%; background:#fff2; }
        header::before { width:190px; height:190px; right:-40px; top:-90px; }
        header::after { width:100px; height:100px; left:8%; bottom:-65px; }
        header h1 { position:relative; font-size:clamp(30px,5vw,48px); letter-spacing:-1.5px; margin-bottom:10px; }
        header p { position:relative; font-size:15px; }
        main { padding:45px 38px 20px; color:var(--ink); background:transparent; }
        .step { position:relative; margin-bottom:30px; padding:26px; border:1px solid var(--line); border-radius:24px; background:rgba(255,255,255,.72); transition:transform .3s,box-shadow .3s,border-color .3s; }
        .step:hover { transform:translateY(-3px); border-color:#ff9b8266; box-shadow:0 16px 35px rgba(79,53,68,.09); }
        .step-number { width:38px; height:38px; line-height:38px; background:var(--coral); box-shadow:0 7px 16px #ff6b5735; }
        .step-title { color:var(--ink); font-size:19px; }
        .step-content { margin-top:18px; }
        .upload-area { padding:48px 28px; border:2px dashed #ff8d78; border-radius:19px; background:#fff6ed; }
        .upload-area:hover,.upload-area.dragover { border-color:var(--coral); background:#ffebdd; transform:scale(1.008); }
        .upload-area p { color:#d84f3b; font-size:17px; font-weight:800; }
        .upload-area small,.file-type-selector label { color:var(--muted); }
        .file-item,.field-card { color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:15px; }
        .file-name,.field-value { color:var(--ink); }
        .file-type-selector select,.field-value { color:var(--ink); background:#fffaf4; border-color:var(--line); border-radius:10px; }
        .btn-remove { border-radius:10px; }
        .btn-parse { padding:14px 30px; border-radius:14px; background:linear-gradient(135deg,var(--coral),#ff9c43); box-shadow:0 9px 20px #ff6b5733; }
        .btn-parse:hover:not(:disabled) { box-shadow:0 14px 25px #ff6b5740; }
        .tabs { border-color:var(--line); }
        .tab-btn { color:var(--muted); border-radius:12px 12px 0 0; }
        .tab-btn:hover { color:var(--coral); background:#fff3ea; }
        .tab-btn.active { color:var(--coral); border-bottom-color:var(--coral); }
        .field-card:hover { border-color:#ff8d78; box-shadow:0 8px 20px #ff6b5718; transform:translateY(-2px); }
        .field-label { color:#d84f3b; }
        .btn-copy { border-radius:10px; background:var(--coral); }
        .btn-copy:hover { background:#e95543; transform:translateY(-1px); }
        footer { border-color:var(--line); background:#fff4e7; color:#986c5c; padding:23px 30px; }
        @media(max-width:768px){ body{padding:0 12px 24px}.kaka-nav{padding:18px 2px}.kaka-nav span{display:none}.container{border-radius:24px}header{padding:38px 18px}main{padding:24px 12px 8px}.step{padding:20px 15px}.step-content{margin-left:0}.upload-area{padding:36px 16px}.fields-grid{grid-template-columns:1fr}.tabs{gap:0;overflow-x:auto;flex-wrap:nowrap}.tab-btn{white-space:nowrap;padding:11px 13px}}
        @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    </style>
</head>
<body>
    <nav class="kaka-nav"><a href="../">← KakaTools</a><span>文件留在瀏覽器，不上傳伺服器</span></nav>
    <div class="container">
        <header>
            <h1>📦 運單預填工具</h1>
            <p>Invoice + Packing List → DHL / FedEx / UPS 運單欄位</p>
        </header>

        <main>
            <!-- Step 1: Upload -->
            <div class="step">
                <div>
                    <span class="step-number">1</span>
                    <span class="step-title">上傳 PDF 文件</span>
                </div>
                <div class="step-content">
                    <div class="upload-area" id="uploadArea">
                        <p>📂 拖拉 PDF 文件到這裡</p>
                        <small>或點擊選擇檔案（支援多檔上傳）</small>
                        <input type="file" id="fileInput" accept=".pdf" multiple>
                    </div>
                    <div class="file-list" id="fileList"></div>
                </div>
            </div>

            <!-- Step 2: Parse -->
            <div class="step">
                <div>
                    <span class="step-number">2</span>
                    <span class="step-title">解析並查看結果</span>
                </div>
                <div class="step-content">
                    <button class="btn-parse" id="parseBtn" disabled>
                        解析 PDF
                    </button>
                </div>
            </div>

            <!-- Step 3: Results -->
            <div class="step">
                <div>
                    <span class="step-number">3</span>
                    <span class="step-title">複製欄位到運單表單</span>
                </div>
                <div class="step-content results" id="results">
                    <div id="errorContainer"></div>

                    <div class="tabs">
                        <button class="tab-btn active" onclick="switchTab('dhl')">
                            📮 DHL Express
                        </button>
                        <button class="tab-btn" onclick="switchTab('fedex')">
                            🚚 FedEx
                        </button>
                        <button class="tab-btn" onclick="switchTab('ups')">
                            📤 UPS
                        </button>
                    </div>

                    <div id="dhl" class="tab-content show"></div>
                    <div id="fedex" class="tab-content"></div>
                    <div id="ups" class="tab-content"></div>
                </div>
            </div>
        </main>

        <footer>
            💡 提示：此工具在您的瀏覽器本機運行，不上傳任何資料到伺服器。PDF 內容完全隱私。
        </footer>
    </div>

    <!-- PDF.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- Custom scripts -->
    <script src="js/carrier-mapping.js"></script>
    <script src="js/pdf-parser.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
